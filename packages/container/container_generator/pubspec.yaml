name: angel3_container_generator
version: 10.0.0
description: Generates the reflection data Angel3's container needs to construct @injectable classes, so it works without dart:mirrors (e.g. in AOT-compiled apps).
homepage: https://angel3-framework.web.app/
repository: https://github.com/dart-backend/angel/
issue_tracker: https://github.com/dart-backend/angel/issues

resolution: workspace
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  analyzer: ^14.0.0
  angel3_container: ^10.0.0
  build: ^4.0.0
  path: ^1.9.0
  source_gen: ^4.0.0
dev_dependencies:
  build_runner: ^2.6.0
  build_test: ^3.5.0
  lints: ^6.0.0
  test: ^1.24.0
