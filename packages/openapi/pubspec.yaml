  angel3_container_generator: ^10.0.0
  angel3_container_mirrors: ^10.0.0
  angel3_mock_request: ^10.0.0
  angel3_serialize: ^10.0.0
  angel3_serialize_generator: ^10.1.0
  build_runner: ^2.6.0
  lints: ^6.0.0
  test: ^1.24.0
