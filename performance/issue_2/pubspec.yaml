name: issue_2_bench
description: Compares Angel3, Shelf, Relic and plain dart:io on the apps of issue 2.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  angel3_mock_request: ^10.0.0
  angel3_route: ^10.2.0
  angel3_framework: ^10.2.0
  logging: ^1.3.0
  relic: ^2.0.0
  relic_native: ^2.0.0
  shelf: ">=1.4.1 <1.5.0"
  shelf_router: ^1.1.4
  vm_service: ^15.0.0

dev_dependencies:
  lints: ^6.0.0

# Measure the workspace's packages, not those on pub.dev.
dependency_overrides:
  angel3_container:
    path: ../../packages/container/container
  angel3_framework:
    path: ../../packages/framework
  angel3_http_exception:
    path: ../../packages/http_exception
  angel3_mock_request:
    path: ../../packages/mock_request
  angel3_model:
    path: ../../packages/model
  angel3_route:
    path: ../../packages/route
